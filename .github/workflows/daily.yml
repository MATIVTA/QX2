name: Publicar desafío diario

on:
  schedule:
    # 7:00am hora de Chile continental (actualmente UTC-4, horario de invierno) = 11:00 UTC
    # -> publica el desafío + abre la encuesta. Usamos minuto 7 (no en punto) para
    # evitar la congestión que Github suele tener justo a las horas redondas,
    # que puede sumar bastante retraso.
    - cron: "7 11 * * *"
    # 7:00pm hora de Chile continental (12h después, coincide con POLL_DURATION_HOURS)
    # = 23:00 UTC -> revela la respuesta
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo a ejecutar manualmente'
        required: true
        default: 'publish'
        type: choice
        options:
          - publish
          - reveal

permissions:
  contents: write # necesario para que el workflow pueda guardar queue.csv y state.json de vuelta al repo

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Determinar modo (publish o reveal)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 11 * * *" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=reveal" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar el bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          POLL_DURATION_HOURS: "12"
          MODE: ${{ steps.mode.outputs.mode }}
        run: node index.js

      - name: Guardar cambios (queue.csv / state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.csv state.json

          if git diff --quiet --cached; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          git commit -m "Actualiza cola y estado del desafío diario"

          # Puede que el Apps Script haya escrito en el repo justo mientras
          # corría este job (ej: alguien editó el Sheet en paralelo). En vez
          # de fallar, jalamos lo nuevo con rebase y reintentamos el push.
          intentos=5
          hasta_que=$intentos
          while [ $hasta_que -gt 0 ]; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push falló, reintentando... ($((intentos - hasta_que + 1))/$intentos)"
            hasta_que=$((hasta_que - 1))
            sleep 5
          done

          echo "No se pudo subir los cambios tras varios intentos."
          exit 1
